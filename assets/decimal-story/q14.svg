<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 242" role="img" aria-labelledby="fig-title-14"><title id="fig-title-14">A길: 집에서 도서관 1.35킬로미터, 도서관에서 공원 0.87킬로미터. B길: 집에서 학교 1.48킬로미터, 학교에서 공원 0.65킬로미터. 선의 길이는 개략도.</title><g font-family="system-ui, sans-serif"><text x="22" y="41" font-size="15" fill="#304c39" text-anchor="start">A길</text><line x1="45" y1="70" x2="315" y2="70" stroke="#93b186" stroke-width="2"/><circle cx="45" cy="70" r="5" fill="#93b186"/><text x="45" y="100" font-size="15" fill="#304c39" text-anchor="middle">집</text><circle cx="180" cy="70" r="5" fill="#93b186"/><text x="180" y="100" font-size="15" fill="#304c39" text-anchor="middle">도서관</text><circle cx="315" cy="70" r="5" fill="#93b186"/><text x="315" y="100" font-size="15" fill="#304c39" text-anchor="middle">공원</text><text x="106" y="58" font-size="16" fill="#304c39" text-anchor="middle">1.35 km</text><text x="250" y="58" font-size="16" fill="#304c39" text-anchor="middle">0.87 km</text><text x="22" y="148" font-size="15" fill="#304c39" text-anchor="start">B길</text><line x1="45" y1="177" x2="315" y2="177" stroke="#8dbab3" stroke-width="2"/><circle cx="45" cy="177" r="5" fill="#8dbab3"/><text x="45" y="207" font-size="15" fill="#304c39" text-anchor="middle">집</text><circle cx="180" cy="177" r="5" fill="#8dbab3"/><text x="180" y="207" font-size="15" fill="#304c39" text-anchor="middle">학교</text><circle cx="315" cy="177" r="5" fill="#8dbab3"/><text x="315" y="207" font-size="15" fill="#304c39" text-anchor="middle">공원</text><text x="106" y="165" font-size="16" fill="#304c39" text-anchor="middle">1.48 km</text><text x="250" y="165" font-size="16" fill="#304c39" text-anchor="middle">0.65 km</text></g></svg>